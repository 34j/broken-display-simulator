[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "broken-display-simulator"
version = "0.1.1"
description = "Simulates broken display."
readme = "README.md"
license = "CC0-1.0"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "click",
  "pysimplegui",
]
urls."Bug Tracker" = "https://github.com/34j/broken-display-simulator/issues"
urls.Changelog = "https://github.com/34j/broken-display-simulator/blob/main/CHANGELOG.md"
urls.documentation = "https://broken-display-simulator.readthedocs.io"
urls.repository = "https://github.com/34j/broken-display-simulator"
scripts.broken-display-simulator = "broken_display_simulator.__main__:main"
scripts.bdsim = "broken_display_simulator.__main__:main"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
